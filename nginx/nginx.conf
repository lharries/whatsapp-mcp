events {
    worker_connections 1024;
}

http {
    # Enable sub_filter for all types
    sub_filter_types *;
    sub_filter_once off;
    
    server {
        listen 9000;
        server_name localhost;
        
        # Proxy /mcp/whatsapp/ to backend
        location /mcp/whatsapp/ {
            # Strip /mcp/whatsapp prefix before forwarding
            rewrite ^/mcp/whatsapp/(.*)$ /$1 break;
            
            proxy_pass http://whatsapp-mcp-server:8000;
            proxy_http_version 1.1;
            
            # Headers for SSE
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Disable buffering for SSE streams
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            
            # Enable chunked transfer encoding
            chunked_transfer_encoding on;
            
            # Rewrite /messages/ to /mcp/whatsapp/messages/ in response body
            sub_filter 'data: /messages/' 'data: /mcp/whatsapp/messages/';
            sub_filter_once off;
            sub_filter_types text/event-stream;
        }
    }
}
