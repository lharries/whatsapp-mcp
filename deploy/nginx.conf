server {
    listen 80;
    server_name 34.242.181.49.nip.io;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name 34.242.181.49.nip.io;

    ssl_certificate /etc/letsencrypt/live/34.242.181.49.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/34.242.181.49.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # MCP server — SSE needs no buffering and long timeouts
    location ~ ^/(sse|messages/|oauth/|authorize|\.well-known/|health) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Games server — everything else
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
